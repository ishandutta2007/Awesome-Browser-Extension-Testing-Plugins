<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1f2937" stroke-width=".7" d="M 40 0 L 0 0 0 40" opacity=".6"/><circle cx="40" cy="40" r="1" fill="#4b5563" opacity=".5"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="badgeShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".4" stdDeviation="6"/></filter></defs><style>@keyframes pulseOrb1{0%{transform:translate(0,0) scale(1);opacity:.45}50%{transform:translate(50px,-20px) scale(1.15);opacity:.75}}@keyframes pulseOrb2{0%{transform:translate(0,0) scale(1);opacity:.4}50%{transform:translate(-40px,25px) scale(1.2);opacity:.65}}@keyframes pulseOrb3{0%{transform:translate(0,0) scale(1);opacity:.3}50%{transform:translate(30px,30px) scale(1.1);opacity:.55}}@keyframes floatCard1{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes floatCard2{0%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyfram