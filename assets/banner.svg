<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.7" opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#4b5563" opacity="0.5" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #94a3b8;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .code-pill {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      font-weight: 600;
    }

    /* Ambient Dynamic Pulsing */
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.45; }
      50% { transform: translate(50px, -20px) scale(1.15); opacity: 0.75; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
      50% { transform: translate(-40px, 25px) scale(1.2); opacity: 0.65; }
    }
    @keyframes pulseOrb3 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      50% { transform: translate(30px, 30px) scale(1.1); opacity: 0.55; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    @keyframes floatCard3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -40; }
    }

    .orb-1 { animation: pulseOrb1 9s ease-in-out infinite; }
    .orb-2 { animation: pulseOrb2 11s ease-in-out infinite; }
    .orb-3 { animation: pulseOrb3 8s ease-in-out infinite; }
    .card-float-1 { animation: floatCard1 5s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 6.5s ease-in-out infinite 0.8s; }
    .card-float-3 { animation: floatCard3 5.8s ease-in-out infinite 1.5s; }
    .stream-line { stroke-dasharray: 6 6; animation: dashStream 3s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- DYNAMIC AMBIENT BACKGROUND GLOWS (STRICTLY IN BACKGROUND) -->
  <g opacity="0.8">
    <circle class="orb-1" cx="200" cy="80" r="140" fill="#6366f1" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="260" r="160" fill="#ec4899" filter="url(#glow)" />
    <circle class="orb-3" cx="720" cy="100" r="120" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Dynamic Circuit / Automation Data Streams -->
  <g opacity="0.35">
    <path class="stream-line" d="M 80 300 Q 300 320 500 290 T 950 310 T 1150 280" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="stream-line" d="M 50 60 Q 350 40 650 70 T 1120 50" fill="none" stroke="#38bdf8" stroke-width="1.8" />
  </g>

  <!-- BROWSER DECORATIVE FLOAT CARDS (RIGHT SIDE) -->
  <g class="card-float-1" transform="translate(860, 60)" filter="url(#badgeShadow)">
    <rect width="280" height="72" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
    <circle cx="36" cy="36" r="16" fill="#0284c7" fill-opacity="0.25" />
    <text x="36" y="42" font-size="18" text-anchor="middle">🧪</text>
    <text x="68" y="32" class="badge-label" fill="#f8fafc">E2E Browser Testing</text>
    <text x="68" y="50" class="code-pill" fill="#38bdf8">Playwright · Puppeteer · Cypress</text>
  </g>

  <g class="card-float-2" transform="translate(880, 150)" filter="url(#badgeShadow)">
    <rect width="270" height="72" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
    <circle cx="36" cy="36" r="16" fill="#8b5cf6" fill-opacity="0.25" />
    <text x="36" y="42" font-size="18" text-anchor="middle">🧩</text>
    <text x="68" y="32" class="badge-label" fill="#f8fafc">Cross-Browser Build</text>
    <text x="68" y="50" class="code-pill" fill="#a78bfa">WXT · Plasmo · CRXJS · web-ext</text>
  </g>

  <g class="card-float-3" transform="translate(850, 240)" filter="url(#badgeShadow)">
    <rect width="290" height="68" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
    <circle cx="36" cy="34" r="16" fill="#10b981" fill-opacity="0.25" />
    <text x="36" y="40" font-size="18" text-anchor="middle">⚡</text>
    <text x="68" y="30" class="badge-label" fill="#f8fafc">Automated Store CI/CD</text>
    <text x="68" y="48" class="code-pill" fill="#34d399">MV3 Validation · Lint · Release</text>
  </g>

  <!-- FOREGROUND BRANDING CONTENT (NEVER BLOCKED) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill Category Badge -->
    <g transform="translate(0, 52)">
      <rect width="320" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="16" cy="16" r="6" fill="#22c55e" />
      <text x="34" y="21" class="code-pill" fill="#c7d2fe">CURATED ECOSYSTEM · EXTENSION QUALITY</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 134)">
      <text class="title-text">Awesome Browser Extension</text>
      <text y="48" class="title-text" fill="url(#accentGrad)">Testing &amp; Plugins</text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(0, 230)">
      <text class="subtitle-text">The definitive catalog of open-source frameworks, test runners, mocks,</text>
      <text y="24" class="subtitle-text">and enterprise SaaS platforms for Chrome, Firefox, Safari &amp; Edge.</text>
    </g>

    <!-- Feature Tags -->
    <g transform="translate(0, 286)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="138" height="28" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="69" y="18" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" fill="#93c5fd" text-anchor="middle">🚀 Manifest V3</text>

      <!-- Pill 2 -->
      <rect x="148" y="0" width="138" height="28" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="217" y="18" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" fill="#c084fc" text-anchor="middle">🎯 Playwright &amp; BiDi</text>

      <!-- Pill 3 -->
      <rect x="296" y="0" width="148" height="28" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="370" y="18" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" fill="#f472b6" text-anchor="middle">🛡️ Static Lint &amp; CSP</text>

      <!-- Pill 4 -->
      <rect x="454" y="0" width="148" height="28" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="528" y="18" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" fill="#6ee7b7" text-anchor="middle">🌐 Cross-Browser CI</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1" opacity="0.6" />
</svg>
